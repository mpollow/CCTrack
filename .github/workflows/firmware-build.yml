name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio test -e native
        working-directory: firmware

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "python[dev]"
      - run: pytest
        working-directory: python
      - run: pytest tools/tests

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags, so `git describe` stamps the version
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-qtpy-${{ hashFiles('firmware/platformio.ini') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -e qtpy_m0
        working-directory: firmware
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-uf2
          path: firmware/.pio/build/qtpy_m0/firmware.uf2

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every PR commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by trailer"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Add sign-off with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi

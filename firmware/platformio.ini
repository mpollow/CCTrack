[platformio]
default_envs = qtpy_m0

; ────────────────────────────────────────────────────────────────────────────
; Hardware target: Adafruit QT Py SAMD21
; ────────────────────────────────────────────────────────────────────────────
[env:qtpy_m0]
platform = atmelsam@8.3.0
board = adafruit_qt_py_m0
framework = arduino

; TinyUSB replaces the stock Arduino USB stack so we can present a composite
; (USB-MIDI + USB-CDC) device. -DUSE_TINYUSB tells the Arduino core to bypass
; its built-in CDC.
; The Adafruit SAMD core bundles TinyUSB — do NOT add it to lib_deps or it
; conflicts. lib_ldf_mode = deep+ finds it automatically in the framework.
build_flags =
    -DUSE_TINYUSB
    -std=gnu++17
    -Wall -Wextra
    -Wno-unused-parameter
build_unflags = -std=gnu++11

lib_archive = no                ; required for TinyUSB descriptor injection
lib_ldf_mode = deep+            ; scans framework libs for bundled TinyUSB
; Exact versions (including BNO08x's transitive deps) so every release tag
; maps to one set of library sources — see NOTICE for their licences.
lib_deps =
    adafruit/Adafruit BNO08x@1.2.5
    adafruit/Adafruit BusIO@1.17.4
    adafruit/Adafruit Unified Sensor@1.1.15
    cmaglie/FlashStorage@1.0.0
    adafruit/Adafruit NeoPixel@1.15.4

upload_protocol = sam-ba
extra_scripts   =
    pre:../tools/firmware_version.py
    pre:../tools/samd_upload_reset.py
    post:../tools/build_uf2.py
monitor_speed = 115200

; ────────────────────────────────────────────────────────────────────────────
; Native env: pure-logic modules from lib/ unit-tested on the host with Unity
; ────────────────────────────────────────────────────────────────────────────
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall -Wextra
    -DUNITY_INCLUDE_CONFIG_H
    -g -fsanitize=address -fno-omit-frame-pointer
test_framework = unity
test_build_src = no
